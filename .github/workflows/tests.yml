name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  optional-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional APK and SAST engines
        run: python -m pip install -e ".[apk,sast]" build
      - name: Validate bundled Semgrep rules
        run: semgrep scan --validate --config src/auto_find_bug/rules/security.yml
      - name: Download pinned Androguard APK integration fixture
        run: |
          mkdir -p .ci-fixtures
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/androguard/androguard/581f7a3251545a97f66ee92b674dd810ee380a00/tests/data/APK/TestActivity.apk \
            --output .ci-fixtures/TestActivity.apk
          test -s .ci-fixtures/TestActivity.apk
      - name: Run tests with optional engines installed and live OSV verification
        env:
          AFB_APK_FIXTURE: .ci-fixtures/TestActivity.apk
          AFB_LIVE_OSV_TEST: "1"
        run: python -m unittest discover -s tests -v
      - name: Build wheel and verify bundled rules are packaged
        run: |
          python -m build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              assert "auto_find_bug/rules/security.yml" in archive.namelist()
          print(f"Verified bundled Semgrep rules in {wheel.name}")
          PY
