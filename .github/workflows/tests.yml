name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  optional-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional APK and SAST engines
        run: python -m pip install -e ".[apk,sast]" "semgrep==1.184.0" build
      - name: Validate bundled Semgrep rules
        run: semgrep scan --validate --config src/auto_find_bug/rules/security.yml
      - name: Download pinned Androguard APK integration fixture
        run: |
          mkdir -p .ci-fixtures
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/androguard/androguard/581f7a3251545a97f66ee92b674dd810ee380a00/tests/data/APK/TestActivity.apk \
            --output .ci-fixtures/TestActivity.apk
          test -s .ci-fixtures/TestActivity.apk
      - name: Run tests with optional engines installed and live OSV verification
        env:
          AFB_APK_FIXTURE: .ci-fixtures/TestActivity.apk
          AFB_LIVE_OSV_TEST: "1"
        run: python -m unittest discover -s tests -v
      - name: Fetch pinned OWASP Benchmark Java labeled corpus
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/OWASP-Benchmark/BenchmarkJava.git .ci-fixtures/BenchmarkJava
          git -C .ci-fixtures/BenchmarkJava checkout 0119da404a3418bc337beb529b72ae755f018f97
      - name: Re-run pinned baseline rules and retain complete baseline case lists
        run: |
          git fetch --no-tags --depth=1 origin babb601e5afb39d166e00a47caa4d18e59b56be0
          git show babb601e5afb39d166e00a47caa4d18e59b56be0:src/auto_find_bug/rules/security.yml > .ci-fixtures/baseline-security.yml
          semgrep scan --config .ci-fixtures/baseline-security.yml --json --metrics=off --quiet --jobs 1 --no-git-ignore .ci-fixtures/BenchmarkJava/src/main/java/org/owasp/benchmark/testcode > .ci-fixtures/owasp-baseline-semgrep.json
          python benchmarks/score_owasp_benchmark.py \
            --expected .ci-fixtures/BenchmarkJava/expectedresults-1.2.csv \
            --semgrep-json .ci-fixtures/owasp-baseline-semgrep.json \
            --benchmark-commit 0119da404a3418bc337beb529b72ae755f018f97 \
            --output .ci-fixtures/owasp-baseline-scorecard.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('benchmarks/owasp-java-v1.2-baseline.json').read_text())['overall_scored_subset']
          actual = json.loads(Path('.ci-fixtures/owasp-baseline-scorecard.json').read_text())['overall_scored_subset']
          keys = ('tp', 'fp', 'fn', 'tn', 'precision', 'recall', 'false_positive_rate')
          assert all(actual[key] == expected[key] for key in keys), (expected, actual)
          print('Pinned baseline rules reproduce the recorded confusion matrix.')
          PY
      - name: Run full OWASP Benchmark Java static scorecard
        run: |
          semgrep scan --config src/auto_find_bug/rules/security.yml --json --metrics=off --quiet --jobs 1 --no-git-ignore .ci-fixtures/BenchmarkJava/src/main/java/org/owasp/benchmark/testcode > .ci-fixtures/owasp-semgrep.json
          python benchmarks/score_owasp_benchmark.py \
            --expected .ci-fixtures/BenchmarkJava/expectedresults-1.2.csv \
            --semgrep-json .ci-fixtures/owasp-semgrep.json \
            --benchmark-commit 0119da404a3418bc337beb529b72ae755f018f97 \
            --baseline benchmarks/owasp-java-v1.2-baseline.json \
            --output .ci-fixtures/owasp-scorecard.json
      - name: Run path-sensitive Java AST scorecard
        run: |
          python benchmarks/java_flow_semgrep_adapter.py \
            --source-root .ci-fixtures/BenchmarkJava/src/main/java/org/owasp/benchmark/testcode \
            --output .ci-fixtures/owasp-java-ast.json
          python benchmarks/score_owasp_benchmark.py \
            --expected .ci-fixtures/BenchmarkJava/expectedresults-1.2.csv \
            --semgrep-json .ci-fixtures/owasp-java-ast.json \
            --benchmark-commit 0119da404a3418bc337beb529b72ae755f018f97 \
            --baseline benchmarks/owasp-java-v1.2-baseline.json \
            --output .ci-fixtures/owasp-java-ast-scorecard.json
      - name: Upload OWASP scorecard artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-find-bug-owasp-benchmark-scorecard
          path: |
            .ci-fixtures/owasp-scorecard.json
            .ci-fixtures/owasp-baseline-scorecard.json
            .ci-fixtures/owasp-java-ast.json
            .ci-fixtures/owasp-java-ast-scorecard.json
      - name: Build wheel and verify bundled rules are packaged
        run: |
          python -m build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              assert "auto_find_bug/rules/security.yml" in archive.namelist()
          print(f"Verified bundled Semgrep rules in {wheel.name}")
          PY
