[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-find-bug"
version = "0.6.0"
description = "Scope-first Bug Bounty assistant with source/APK intelligence and public advisory correlation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "questionary>=2.0",
  "rich>=13.7",
]

[project.optional-dependencies]
apk = ["androguard>=4.1.3"]

[project.scripts]
auto-find-bug = "auto_find_bug.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
